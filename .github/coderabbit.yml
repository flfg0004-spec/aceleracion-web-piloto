# Configuración de CodeRabbit — review IA en PRs
# Veredicto del informe aceleracion-desarrollo-web-2026: Adoptar (51.2% F1,
# mínimo ruido ~2 FP/run, gratis en OSS). Instalación: app GitHub CodeRabbit.
language: es-ES
early_access: false

reviews:
  profile: chill            # minimiza falsos positivos (ruido bajo)
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/lockfiles"
    - "!**/*.snap"

chat:
  auto_reply: true