name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Nemesis NT-ACEL-01: los scripts usan Bun (bun test / bun --bun vite);
      # el runner necesita Bun instalado explicitamente.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile=false # bootstrap: lockfile se congela al primer release
      - name: Lint (Biome)
        run: pnpm lint
      - name: Unit tests (Bun)
        run: pnpm test
      - name: Build (Vite 8 + Rolldown)
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E smoke (Playwright)
        run: pnpm exec playwright test --project=chromium